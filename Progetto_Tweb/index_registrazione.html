	index_registrazione.php: pagina html dove l'utente può fare la registrazione al sito inserendo, con dovute verifiche, dati.  
                             Ovvero nome, cognome, username, email, password e la conferma password con le loro dovute verifiche sintattiche.

-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link href="css/graficaPagine.css" rel="stylesheet" type="text/css">
        <script src="js/validazione.js"></script> 
        <title>Registrazione AdsSite</title>
    </head>

	<body>
		<div id="total_zone">
            <div id="main_zone">
                <h2>Registrazione</h2>

                    <form name="form_registration" method="post" action="registrazione.php">
                            <input type="hidden" name="id_iscritto">
                        <table>
            
                        <tr><td>Nome: </td><td><input type="text" class="input" name="nome" id="nome" placeholder="Vietato caratteri numerico"></td></tr>
                        <tr><td>Cognome: </td><td><input type="text" class="input" name="cognome" id="cognome" placeholder="Vietato caratteri numerico"></td></tr>
                        <tr><td>Username: </td><td><input type="text" class="input" name="username" placeholder="caratteri MIN 6 MAX 12"></td></tr>
                        <tr><td>Email: </td><td><input type="email" name="email" class="input" placeholder="esempio@gmail.com" id="gmail"></td></tr>
                        <tr><td>Password: </td><td><input class="input" type="password" name="password" placeholder="caratteri MIN 8 MAX 15"></td></tr>
                        <tr><td>Conferma password: </td><td><input class="input" type="password" name="conf_password" placeholder="ripeti password precedente"></td></tr>
                        <tr><td>Gia' registrato? <td><a href="index.html" target="_self">Accedi!</a></td>
                        
                        </table>
                    
                        <button class="button" type="submit" onclick="return controlloSubmit();"><span>Registrati</span></button>
                        
                    </form>

                    <div id="error-messages"></div>
            </div>
        </div>

        <div id="validation">
            <p>
            <a href="http://jigsaw.w3.org/css-validator/check/referer"><img src="http://jigsaw.w3.org/css-validator/images/vcss" alt="Valid CSS!"></a>
        </div>

	</body>
</html>
